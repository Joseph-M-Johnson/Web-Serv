<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Portal</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="page-shell error-shell">
        <header class="topbar">
            <div class="brand">Express Portal</div>
            <nav class="nav-links" aria-label="Main navigation">
                <a href="/">Home</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/projects">Projects</a>
                <a href="/guestbook">Guestbook</a>
                <a href="/space">Space</a>
            </nav>
        </header>

        <main class="app-card error-card">
            <span class="eyebrow">404 Error</span>
            <div class="error-code">404</div>

            <div class="error-copy">
                <h1>Page not found</h1>
                <p>The page you were looking for might have been moved, deleted, or never existed.</p>
            </div>

            <div class="error-actions">
                <a href="/" class="primary-button">Go Home</a>
                <a href="/dashboard" class="secondary-button">Dashboard</a>
            </div>
        </main>
    </div>
</body>
